spring.application.name=connector-azure
spring.jackson.serialization.indent_output=true
server.port=8080



# ── Legacy vCenter properties (not used by Azure SCIM connector) ──────
vcenter.createUserURL=https://<vcenter_app_name>/abcd
vcenter.updateUserURL=https://<vcenter_app_name>/abcd
vcenter.entitlementsURL=https://okta.com
vcenter.accessTokenURL=https://okta.com
vcenter.listAllUsersURL=https://<vcenter_app_name>/Users
vcenter.addUserRole=https://okta.com
vcenter.removeUserRole=https://okta.com
vcenter.totalUsers=1000
vcenter.listGroupsURL=https://<vcenter_app_name>/usergroup/Groups
# Disable credential fetch on startup — not needed for Azure connector
vcenter.credURL=https://xxx.r1.pcf.okta.com/api/authconfig?jobname=xxx.properties&enckey=123
vcenter.credFetchEnabled=false

# ── Connector REST config ─────────────────────────────────────────────
# Env var that overrides the config file path at runtime
connector.rest.config.env-var=CONNECTOR_REST_CONFIG_PATH
# Default path — matches the Docker volume mount in Dockerfile / build-and-run.sh
connector.rest.config.default-path=/run/secrets/connector-azure/okta-config.json
# Local development override (uncomment and set your local path):
#connector.rest.config.default-path=C:/Users/deekshith.dasi/Documents/okta-config.json

# Health endpoint contract:
# GET /actuator/health (app-relative, no auth) -> {"status":"UP"} with HTTP 200
# In WAR deployments, final URL includes the WAR context path (for example: /connector-azure/actuator/health).
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never
management.health.probes.enabled=false
management.health.db.enabled=false
